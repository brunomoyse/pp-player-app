query GetTournaments($clubId: UUID, $from: DateTime, $to: DateTime, $status: TournamentStatus, $pagination: PaginationInput) {
  tournaments(clubId: $clubId, from: $from, to: $to, status: $status, pagination: $pagination) {
    items {
      id
      title
      description
      clubId
      startTime
      endTime
      buyInCents
      rakeCents
      seatCap
      status
      liveStatus
      createdAt
      updatedAt
    }
    totalCount
    pageSize
    offset
    hasNextPage
  }
}

query GetTournament($id: UUID!) {
  tournament(id: $id) {
    id
    title
    description
    startTime
    endTime
    buyInCents
    rakeCents
    status
    liveStatus
    lateRegistrationLevel
    voucherValueCents
    levelTwoBonusChips
    rebuyMax
    addonChips
    addonPriceCents
    bountyType
    bountyAmountCents
    structure {
      id
      tournamentId
      levelNumber
      smallBlind
      bigBlind
      ante
      durationMinutes
      isBreak
      breakDurationMinutes
    }
    clock {
      id
      tournamentId
      status
      currentLevel
      timeRemainingSeconds
      levelStartedAt
      levelEndTime
      totalPauseDurationSeconds
      autoAdvance
      currentStructure {
        id
        tournamentId
        levelNumber
        smallBlind
        bigBlind
        ante
        durationMinutes
        isBreak
        breakDurationMinutes
      }
      nextStructure {
        id
        tournamentId
        levelNumber
        smallBlind
        bigBlind
        ante
        durationMinutes
        isBreak
        breakDurationMinutes
      }
    }
    registrations {
      id
      userId
      clubPlayerId
      displayName
      registrationTime
      status
      currentBountyCents
      notes
      user {
        id
        firstName
        username
      }
    }
  }
}

query GetTournamentStructure($tournamentId: ID!) {
  tournamentStructure(tournamentId: $tournamentId) {
    id
    tournamentId
    levelNumber
    smallBlind
    bigBlind
    ante
    durationMinutes
    isBreak
    breakDurationMinutes
  }
}

query GetTournamentPlayers($tournamentId: UUID!, $pagination: PaginationInput) {
  tournamentPlayers(tournamentId: $tournamentId, pagination: $pagination) {
    items {
      registration {
        id
        registrationTime
        status
        notes
        waitlistPosition
      }
      user {
        id
        firstName
        lastName
        username
        email
        role
      }
    }
    totalCount
    pageSize
    offset
    hasNextPage
  }
}

query GetTournamentPayout($tournamentId: ID!) {
  tournamentPayout(tournamentId: $tournamentId) {
    id
    tournamentId
    templateId
    playerCount
    totalPrizePool
    positions {
      position
      percentage
      amountCents
    }
    createdAt
    updatedAt
  }
}

query GetTournamentEntries($tournamentId: ID!) {
  tournamentEntries(tournamentId: $tournamentId) {
    id
    tournamentId
    userId
    entryType
    amountCents
    chipsReceived
    recordedBy
    notes
    createdAt
    updatedAt
  }
}

query GetTournamentEntryStats($tournamentId: ID!) {
  tournamentEntryStats(tournamentId: $tournamentId) {
    tournamentId
    totalEntries
    totalAmountCents
    uniquePlayers
    initialCount
    rebuyCount
    reEntryCount
    addonCount
    totalChips
    playersRemaining
  }
}

query GetTournamentResults($tournamentId: ID!) {
  tournamentResults(tournamentId: $tournamentId) {
    id
    tournamentId
    userId
    clubPlayerId
    displayName
    finalPosition
    prizeCents
    points
    createdAt
  }
}

query GetTournamentBounties($tournamentId: ID!) {
  tournamentBounties(tournamentId: $tournamentId) {
    id
    tournamentId
    hunterClubPlayerId
    victimClubPlayerId
    hunterName
    victimName
    amountCents
    createdAt
  }
}

query GetLeaderboard($period: LeaderboardPeriod, $pagination: PaginationInput, $clubId: UUID) {
  leaderboard(period: $period, pagination: $pagination, clubId: $clubId) {
    items {
      user {
        id
        firstName
        lastName
        username
        email
      }
      clubPlayerId
      displayName
      rank
      totalTournaments
      totalBuyIns
      totalWinnings
      totalItm
      itmPercentage
      averageFinish
      firstPlaces
      finalTables
      points
    }
    totalCount
    pageSize
    offset
    hasNextPage
  }
}

query GetMyTournamentStatistics {
  myTournamentStatistics {
    last30Days {
      totalItm
      totalTournaments
      totalWinnings
      itmPercentage
    }
    lastYear {
      totalItm
      totalTournaments
      totalWinnings
      itmPercentage
    }
    allTime {
      totalItm
      totalTournaments
      totalWinnings
      itmPercentage
    }
  }
}

query GetMyRecentTournamentResults($limit: Int) {
  myRecentTournamentResults(limit: $limit) {
    result {
      id
      tournamentId
      userId
      finalPosition
      prizeCents
      points
      notes
      createdAt
    }
    tournament {
      id
      title
      startTime
      buyInCents
      rakeCents
    }
  }
}
