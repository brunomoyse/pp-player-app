fragment FriendFields on Friend {
  friendshipId
  userId
  name
  status
  isIncoming
  iCanRegisterThem
  canRegisterMe
  flame {
    sharedNights
    lastShared
    alive
  }
}

query GetMyFriends {
  myFriends {
    ...FriendFields
  }
}

query GetIncomingFriendRequests {
  incomingFriendRequests {
    ...FriendFields
  }
}

query GetOutgoingFriendRequests {
  outgoingFriendRequests {
    ...FriendFields
  }
}

query GetMyYearInPoker($year: Int) {
  myYearInPoker(year: $year) {
    year
    tournaments
    winningsCents
    itmCount
    bestFinish
    checkIns
    longestStreak
    favoriteClub
    nemesisName
  }
}
