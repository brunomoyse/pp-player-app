query GetMyProAnalytics {
  myProAnalytics {
    byClub {
      clubId
      clubName
      tournaments
      buyinsCents
      winningsCents
      netCents
    }
    byBuyIn {
      buyInCents
      tournaments
      buyinsCents
      winningsCents
      netCents
    }
    cumulativePnl {
      day
      netCents
      cumulativeCents
    }
  }
}
