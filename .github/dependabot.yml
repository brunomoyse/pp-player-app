# Dependabot config for pp-player-app (Expo SDK 56 / React Native).
# Two ecosystems: npm (package.json) and the GitHub Actions workflows.
# CocoaPods (ios/Podfile) isn't supported by Dependabot and is driven by the JS
# deps anyway, so it's intentionally not listed.
#
# Guiding rule: the Expo SDK owns the native runtime. `expo`, every `expo-*` /
# `@expo/*` package, React, React Native and the RN native libraries are all
# pinned to the installed SDK and must only move via `expo install` / the SDK
# upgrade flow — never bumped piecemeal by Dependabot, or the JS will desync from
# the native build. So those are grouped (Expo) or ignored (RN runtime) below.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      # Expo SDK packages move as a single unit (the SDK upgrade flow bumps them
      # together). Bundle every in-range bump into ONE "expo" PR so an SDK patch
      # is one review, not twenty. Majors are ignored below (whole-SDK upgrade).
      expo:
        patterns:
          - "expo"
          - "expo-*"
          - "@expo/*"
      # Everything else low-risk, split runtime vs tooling to cut noise.
      production-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      development-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # --- Expo SDK family: majors only via the whole-SDK upgrade flow ---
      - dependency-name: "expo"
        update-types: ["version-update:semver-major"]
      - dependency-name: "expo-*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@expo/*"
        update-types: ["version-update:semver-major"]

      # --- React Native runtime: version is dictated by the installed Expo SDK.
      # Ignore entirely (incl. patch) — `expo install --fix` is the source of
      # truth for these, not Dependabot. A 0.x "minor" RN bump is breaking and a
      # grouped PR previously tried to push react-native 0.85 -> 0.86 off-SDK. ---
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "react-native"
      - dependency-name: "react-native-reanimated"
      - dependency-name: "react-native-worklets"
      - dependency-name: "react-native-screens"
      - dependency-name: "react-native-safe-area-context"
      - dependency-name: "react-native-svg"
      - dependency-name: "react-native-gesture-handler"
      - dependency-name: "@react-native-async-storage/async-storage"
      - dependency-name: "@shopify/react-native-skia"

      # --- Incompatible majors: pinned until upstream support lands ---
      # NativeWind 4 is built on Tailwind CSS 3's plugin API (removed in v4).
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      # graphql-ws peer caps at ^16; graphql 17 would break the subscription path.
      - dependency-name: "graphql"
        update-types: ["version-update:semver-major"]
      # jest-expo 56's preset targets jest 29 internals; jest 30 fails to run.
      - dependency-name: "jest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/jest"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
