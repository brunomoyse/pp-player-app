# Native e2e: covers the guest-profile redesign and the authenticated profile's
# grouped sections (the "anti-slop" UI pass). Runs against the real pp-service.
# Mirrors login-and-browse.yaml conventions: deep-link navigation, real-data
# assertions. The brand mark carries accessibilityLabel="PocketPair", so it is
# assertable even though the custom Text component may not surface to a11y.
appId: com.pocketpair.app
# Credentials default to the shared test account (real pp-service). Override for a
# local backend run: maestro test -e EMAIL=you@example.com -e PASSWORD=secret ...
env:
  EMAIL: native-e2e@pocketpair.test
  PASSWORD: Passw0rd!
---
- launchApp:
    clearState: true
    permissions: { all: allow }

# --- Guest profile: brand-led hero (was the bare "Login" title before) ---
# Reaching /profile while logged out renders the guest CTA screen.
- openLink: pocketpair://profile
- assertVisible: "PocketPair"          # brand mark (accessibilityLabel) + headline
- assertVisible: "Create Account"      # Button titles surface to a11y
- assertVisible: "Login"
- takeScreenshot: guest-profile-redesign

# --- Log in through the dedicated route ---
- openLink: pocketpair://login
- assertVisible: "Welcome back"
- tapOn:
    below: "Email"
- inputText: ${EMAIL}
- tapOn:
    below: "Password"
- inputText: ${PASSWORD}
- hideKeyboard
- tapOn: "Login"

# --- Authenticated profile: settings split into three grouped cards ---
# (previously one ~13-row card). Tools card is feature-flag gated and may be absent.
- tapOn: "Me"
- assertVisible: "Quick Actions"
- assertVisible: "Tournaments"
- assertVisible: "My Registrations"
- assertVisible: "Browse Tournaments"
- scrollUntilVisible:
    element:
      text: "Settings"
    direction: DOWN
- assertVisible: "Settings"
- scrollUntilVisible:
    element:
      text: "Logout"
    direction: DOWN
- takeScreenshot: profile-grouped-sections
