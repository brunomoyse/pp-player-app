# Native e2e: covers the guest-profile redesign and the authenticated profile's
# grouped sections (the "anti-slop" UI pass). Runs against the real pp-service.
# Mirrors login-and-browse.yaml conventions: deep-link navigation, real-data
# assertions. The brand mark carries accessibilityLabel="PocketPair", so it is
# assertable even though the custom Text component may not surface to a11y.
appId: com.pocketpair.app
# Credentials default to the shared test account (real pp-service). Override for a
# local backend run: maestro test -e EMAIL=you@example.com -e PASSWORD=secret ...
env:
  EMAIL: native-e2e@pocketpair.test
  PASSWORD: Passw0rd!
---
- launchApp:
    clearState: true
    clearKeychain: true
    permissions: { all: allow }

# --- Guest profile: brand-led hero (was the bare "Login" title before) ---
# Reaching /profile while logged out renders the guest CTA screen.
- openLink: pocketpair://profile
- assertVisible: "PocketPair"          # brand mark (accessibilityLabel) + headline
- assertVisible: "Create Account"      # Button titles surface to a11y
- assertVisible: "Login"
- takeScreenshot: shot-guest-profile

# --- Log in through the dedicated route ---
- runFlow:
    file: helpers/login.yaml
    env:
      EMAIL: ${EMAIL}
      PASSWORD: ${PASSWORD}

# --- Authenticated profile: settings split into three grouped cards ---
# (previously one ~13-row card). Tools card is feature-flag gated and may be
# absent. Reached by deep link — Maestro reports a tab-bar tap as COMPLETED
# without switching tabs (see e2e/README.md).
- openLink: pocketpair://profile
- extendedWaitUntil:
    visible: "Quick Actions"
    timeout: 15000
# Asserted on the section headers, not the row titles inside them: each row is
# a Pressable, and iOS collapses its children into one accessibility element,
# so "Achievements" / "My Registrations" are not matchable by text.
#
# The cards sit below the fold — scroll to each rather than asserting into the
# viewport, which is what made this flow stale as the screen grew.
- scrollUntilVisible:
    element:
      text: "Notifications"
    direction: DOWN
- scrollUntilVisible:
    element:
      text: "Settings"
    direction: DOWN
- scrollUntilVisible:
    element:
      text: "Logout"
    direction: DOWN
- takeScreenshot: shot-profile-sections
