# Native e2e: guest language switcher (no account required).
#
# CAVEATS (dev build):
#  - launchApp cold-starts the app; on a plain debug build (no expo-dev-client)
#    the JS bundle is refetched from Metro, so we wait generously before asserting.
#  - The custom `Text` component does not surface its string to the iOS
#    accessibility tree, so option labels (Français/English/Nederlands) and the
#    pill text can't be matched by `assertVisible`. We drive those by point and
#    capture screenshots. Tab labels and `Button` titles ("Create Account") ARE
#    exposed, so we anchor on those.
appId: com.pocketpair.app
---
- launchApp:
    permissions: { all: allow }

# Wait for the JS bundle, then open the Login/Profile tab.
- extendedWaitUntil:
    visible: { text: "Home, tab, 1 of 5" }
    timeout: 30000
- tapOn: { text: "Login, tab, 5 of 5" }
- assertVisible: "Create Account"            # unique to the guest profile
- takeScreenshot: A-guest-english

# Tap the "Language · English" pill (~65% down) → language modal opens.
- tapOn:
    point: "50%,65%"
- takeScreenshot: B-language-modal-open

# Select Français (3rd row of the bottom sheet, ~88% down).
- tapOn:
    point: "50%,88%"
- takeScreenshot: C-guest-french
