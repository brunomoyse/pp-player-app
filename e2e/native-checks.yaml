# Native e2e: guest language switcher (no account required).
#
# Re-pointed onto stable hooks (was point-taps): the shared `Text` primitive now
# surfaces its string to the accessibility tree, and the language pill + option
# rows carry explicit testIDs (`open-language`, `language-option-<locale>`) plus
# accessibilityLabels. Tabs use their `tabBarButtonTestID`s (`tab-*`).
#
# Dev-build note: launchApp cold-starts the app; on a plain debug build (no
# expo-dev-client) the JS bundle is refetched from Metro, so we wait generously
# for the first tab before asserting.
appId: com.pocketpair.app
---
- launchApp:
    permissions: { all: allow }

# Wait for the JS bundle, then open the Login/Profile tab.
- extendedWaitUntil:
    visible: { id: "tab-home" }
    timeout: 30000
- tapOn: { id: "tab-profile" }
- assertVisible: "Create Account"            # unique to the guest profile
- takeScreenshot: A-guest-english

# Open the language bottom sheet via its testID.
- tapOn: { id: "open-language" }
- assertVisible: { id: "language-option-fr" }
- takeScreenshot: B-language-modal-open

# Select Français by its stable option id.
- tapOn: { id: "language-option-fr" }
- takeScreenshot: C-guest-french
