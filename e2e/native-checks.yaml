# Native e2e: guest profile + the language control (no account required).
#
# Grounded in stable hooks: the shared `Text` primitive surfaces its string to
# the accessibility tree, and the language pill carries an explicit testID
# (`open-language`) plus an accessibilityLabel.
#
# LIMITATION — the locale sheet itself is not asserted. `LanguageModal` renders
# in a React Native `Modal`, and Maestro's iOS driver cannot see into one: with
# a Modal on screen `maestro hierarchy` returns nothing but the status bar, so
# `language-option-fr` is unreachable however long you wait. The same applies to
# the club picker. Locale coverage therefore lives in the jest suite
# (src/i18n/__tests__/locales.test.ts, which checks that all three locales
# define the same keys); this flow verifies that the control is present and
# responds.
#
# Dev-build note: launchApp cold-starts the app; on a plain debug build (no
# expo-dev-client) the JS bundle is refetched from Metro, so we wait generously
# for the first tab before asserting.
appId: com.pocketpair.app
---
- launchApp:
    clearState: true
    clearKeychain: true
    permissions: { all: allow }

# Wait for the JS bundle, then open the Login/Profile tab. Reached by deep link
# — Maestro reports a tab-bar tap as COMPLETED without switching tabs (see
# e2e/README.md).
- extendedWaitUntil:
    visible: { id: "tab-home" }
    timeout: 30000
- openLink: pocketpair://profile
- extendedWaitUntil:
    visible: "Create Account"
    timeout: 15000
- assertVisible: "PocketPair"
- takeScreenshot: shot-guest-english

# The language control is present and responds.
- assertVisible: { id: "open-language" }
- tapOn: { id: "open-language" }
